[project]
name = "airflow-mcp"
version = "0.1.0"
description = "MCP server for Apache Airflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
